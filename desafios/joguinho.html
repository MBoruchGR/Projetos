<body id="cookie" class="corpo">
    <div class="cookie">
        <h1>Cookies: <span id="contador">0</span></h1><br>
        <button onclick="clicar()">
            <img src="Cookie_JE2_BE2.webp" alt="Cookie">
        </button>
    </div>
    
</body>
<script>
let cookies = 0;

function clicar() {
    cookies++;
    document.getElementById("contador").textContent = cookies;
}
</script>
